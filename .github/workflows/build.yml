name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version check
        shell: pwsh
        run: python scripts/check_versions.py --tag $env:GITHUB_REF_NAME
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build backend (onedir)
        run: pyinstaller build_desktop.spec --noconfirm
      - name: Smoke test backend
        shell: pwsh
        run: |
          $env:AMR_DATA_DIR = "$env:TEMP\amr-smoke"
          New-Item -ItemType Directory -Force -Path $env:AMR_DATA_DIR | Out-Null
          $proc = Start-Process -FilePath "dist/AIMediaRenamerBackend/AIMediaRenamerBackend.exe" -ArgumentList "--host","127.0.0.1","--port","8123","--smoke-test" -PassThru
          $proc.WaitForExit(60000) | Out-Null
          if (-not $proc.HasExited -or $proc.ExitCode -ne 0) {
            if (Test-Path "$env:AMR_DATA_DIR/logs/backend-process.log") {
              Get-Content "$env:AMR_DATA_DIR/logs/backend-process.log"
            }
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install root npm dependencies
        run: npm ci
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Media Renamer ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig