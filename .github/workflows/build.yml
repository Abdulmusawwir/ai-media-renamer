name: Build & Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        # build_v2.spec bundles frontend/dist; PyInstaller only warns when it is
        # missing, which would ship an exe with no SPA (the v2.0.0 behaviour).
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build EXE
        run: pyinstaller build_v2.spec --noconfirm
      - name: Smoke test EXE
        # launch.py ignores argv (no --check-only flag): boot the exe and probe
        # /health on the auto-picked loopback port (8000-8010), then stop it.
        shell: powershell
        run: |
          Start-Process dist\AIMediaRenamer.exe
          $ok = $false
          foreach ($port in 8000..8010) {
            for ($i = 0; $i -lt 6; $i++) {
              try {
                $r = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 5
                if ($r.status -eq "ok") { $ok = $true; break }
              } catch {}
              Start-Sleep -Seconds 5
            }
            if ($ok) { break }
          }
          Stop-Process -Name AIMediaRenamer -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/AIMediaRenamer.exe
