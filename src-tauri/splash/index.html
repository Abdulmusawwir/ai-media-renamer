<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Media Renamer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b16;
        --card: rgba(17, 24, 42, 0.92);
        --accent: #7c9cff;
        --text: #f4f7ff;
        --muted: #9aa8c9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--bg);
      }

      body {
        position: relative;
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(1100px 620px at 12% -10%, rgba(92, 124, 255, 0.22), transparent 60%),
          radial-gradient(900px 600px at 100% 110%, rgba(126, 92, 255, 0.16), transparent 62%),
          linear-gradient(160deg, #0b1122 0%, #070b16 100%);
      }

      main {
        position: relative;
        width: 350px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 30px 32px 28px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 22px;
        background: var(--card);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(14px);
      }

      main::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 32px;
        right: 32px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.85;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: linear-gradient(145deg, #8fa8ff, #5271e8);
        box-shadow: 0 10px 24px rgba(82, 113, 232, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        color: #fff;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      h1 {
        margin: 2px 0 0;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.1px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      .spinner {
        margin-top: 8px;
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">AI</div>
      <h1>AI Media Renamer</h1>
      <p>Setting up your workspace…</p>
      <div class="spinner" aria-hidden="true"></div>
    </main>
  </body>
</html>
