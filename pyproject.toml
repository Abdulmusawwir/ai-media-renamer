[project]
name = "ai-media-renamer"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["engine"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
exclude = ["tests/", "dist/", "build/"]

[[tool.mypy.overrides]]
module = ["openai.*", "numpy.*", "ollama.*"]
ignore_errors = true
