<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none">
  <defs>
    <radialGradient id="glow1" cx="12%" cy="8%" r="55%" fx="12%" fy="8%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B0B0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="92%" r="50%" fx="88%" fy="92%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0B0B0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E6EDFF"/>
      <stop offset="100%" stop-color="#9DB8FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="#0B0B0F"/>
  <rect width="1600" height="560" fill="url(#glow1)"/>
  <rect width="1600" height="560" fill="url(#glow2)"/>

  <!-- subtle film strip hint -->
  <g opacity="0.06">
    <rect x="-40" y="470" width="1680" height="8" rx="4" fill="#3B82F6"/>
    <rect x="-40" y="490" width="1680" height="8" rx="4" fill="#8B5CF6"/>
    <rect x="-40" y="510" width="1680" height="8" rx="4" fill="#3B82F6"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="200" y="120" width="232" height="40" rx="20" fill="#12141C" stroke="#2A2F3E"/>
    <circle cx="228" cy="140" r="6" fill="#34D399"/>
    <text x="244" y="146" fill="#A1A1AA" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">Runs 100% locally</text>
  </g>

  <!-- title -->
  <text x="200" y="252" fill="url(#titleGrad)" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1">AI Media Renamer</text>

  <!-- tagline -->
  <text x="200" y="322" fill="#D4D4D8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Never rename a file by hand again.</text>
  <text x="200" y="368" fill="#71717A" font-family="Segoe UI, Arial, sans-serif" font-size="21">AI looks at each video, photo, document &amp; audio file — then renames it,</text>
  <text x="200" y="398" fill="#71717A" font-family="Segoe UI, Arial, sans-serif" font-size="21">categories it, and writes searchable metadata your editing tools can read.</text>

  <!-- feature pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">
    <rect x="200" y="440" width="180" height="44" rx="22" fill="#13151D" stroke="#262B39"/>
    <text x="230" y="468" fill="#D4D4D8">Videos</text>
    <rect x="394" y="440" width="196" height="44" rx="22" fill="#13151D" stroke="#262B39"/>
    <text x="424" y="468" fill="#D4D4D8">Photos</text>
    <rect x="604" y="440" width="236" height="44" rx="22" fill="#13151D" stroke="#262B39"/>
    <text x="634" y="468" fill="#D4D4D8">Documents</text>
    <rect x="854" y="440" width="184" height="44" rx="22" fill="#13151D" stroke="#262B39"/>
    <text x="884" y="468" fill="#D4D4D8">Audio</text>
  </g>

  <!-- right side app window mock -->
  <g transform="translate(1070,96)">
    <rect width="360" height="368" rx="18" fill="#13151D" stroke="#262B39"/>
    <rect x="0" y="0" width="360" height="52" rx="18" fill="#0F1117"/>
    <rect x="0" y="26" width="360" height="26" fill="#0F1117"/>
    <circle cx="24" cy="26" r="6" fill="#3F3F46"/>
    <circle cx="44" cy="26" r="6" fill="#3F3F46"/>
    <circle cx="64" cy="26" r="6" fill="#3F3F46"/>
    <text x="110" y="33" fill="#71717A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">AI Media Renamer</text>
    <rect x="16" y="72" width="328" height="26" rx="6" fill="#1C2029"/>
    <rect x="16" y="108" width="328" height="26" rx="6" fill="#1C2029"/>
    <rect x="16" y="144" width="240" height="26" rx="6" fill="#1C2029"/>
    <rect x="266" y="144" width="78" height="26" rx="6" fill="#182338"/>
    <rect x="16" y="180" width="328" height="26" rx="6" fill="#1C2029"/>
    <rect x="16" y="216" width="260" height="26" rx="6" fill="#1C2029"/>
    <rect x="286" y="216" width="58" height="26" rx="6" fill="#34D399" opacity="0.85"/>
    <rect x="16" y="252" width="180" height="26" rx="6" fill="#1C2029"/>
    <rect x="206" y="252" width="138" height="26" rx="6" fill="#1C2029"/>
    <rect x="16" y="298" width="220" height="38" rx="10" fill="url(#accent)" filter="url(#soft)"/>
    <text x="126" y="322" fill="#0B0B0F" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Run AI Analysis</text>
  </g>
</svg>
