services:
  # NOTE — host ports bind to loopback (127.0.0.1) ONLY by default.
  # The renamer UI has no authentication: do not remove the "127.0.0.1:" prefix
  # unless you explicitly want LAN access, and only on a network you trust.
  # For LAN exposure change the left side to "8501:8000" (or "0.0.0.0:8000:8000").
  renamer:
    build: .
    container_name: ai-media-renamer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Mount the folder of media you want to organize (read/write by the app):
      - ./media:/media
      # Persist sessions / settings between container restarts:
      - renamer_data:/root/.config/ai-media-renamer

volumes:
  renamer_data:
