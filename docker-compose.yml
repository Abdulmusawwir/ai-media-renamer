services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  renamer:
    build: .
    container_name: ai-media-renamer
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - renamer_sessions:/root/.config/ai-media-renamer
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
  renamer_sessions:
